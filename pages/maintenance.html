<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>En construction | Nicolas Blin</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #030712;
            --accent: #22d3ee;
            --text-main: #f3f4f6;
            --text-muted: #9ca3af;
            --card: rgba(17, 24, 39, 0.7);
        }

        body {
            margin: 0;
            padding: 0;
            background-color: var(--bg);
            color: var(--text-main);
            font-family: 'Plus Jakarta Sans', sans-serif;
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100vh;
            text-align: center;
        }

        .container {
            max-width: 500px;
            padding: 3rem 2rem;
            background: var(--card);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 24px;
            backdrop-filter: blur(12px);
            position: relative;
        }

        .icon-box {
            font-size: 3.5rem;
            color: var(--accent);
            margin-bottom: 1.5rem;
        }

        h1 {
            font-size: 2rem;
            font-weight: 800;
            margin-bottom: 1rem;
        }

        p {
            color: var(--text-muted);
            margin-bottom: 2.5rem;
            line-height: 1.6;
        }

        /* --- BOUTONS --- */
        .actions {
            display: flex;
            flex-direction: column;
            gap: 12px;
            align-items: center;
        }

        .btn-primary {
            background-color: var(--text-main);
            color: var(--bg);
            text-decoration: none;
            padding: 0.8rem 2rem;
            border-radius: 12px;
            font-weight: 700;
            transition: 0.3s;
            width: 100%;
        }

        .btn-primary:hover {
            background-color: var(--accent);
            transform: translateY(-2px);
        }

        .btn-back {
            color: var(--accent);
            text-decoration: none;
            font-size: 0.9rem;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 8px;
            transition: 0.3s;
            margin-top: 1rem;
        }

        .btn-back:hover {
            opacity: 0.8;
            gap: 12px; /* Petit effet de mouvement au survol */
        }

        .footer-note {
            margin-top: 3rem;
            font-size: 0.75rem;
            color: var(--text-muted);
            opacity: 0.5;
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="icon-box">
            <i class="fa-solid fa-code-branch"></i>
        </div>
        
        <h1>Projet en déploiement</h1>
        <p>La documentation détaillée de ce projet est en cours de finalisation. En attendant, vous pouvez consulter mon dépôt GitHub.</p>
        
        <div class="actions">
            <a href="https://nicolasbn040520039.wixsite.com/portfolio-nblin" class="btn-primary">
                Consulter les sources <i class="fa-solid fa-external-link"></i>
            </a>

            <a href="https://nblinpro.github.io/portfolio/pages/projets.html" class="btn-back">
                <i class="fa-solid fa-arrow-left"></i> Retour aux projets
            </a>
        </div>

        <div class="footer-note">
            © 2026 Nicolas Blin | Expert SI
        </div>
    </div>

</body>
</html>
