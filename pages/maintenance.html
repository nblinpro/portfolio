<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Maintenance | Nicolas Blin</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #030712;
            --accent: #22d3ee;
            --text-main: #f3f4f6;
            --text-muted: #9ca3af;
            --card: rgba(17, 24, 39, 0.7);
        }

        body {
            margin: 0;
            padding: 0;
            background-color: var(--bg);
            color: var(--text-main);
            font-family: 'Plus Jakarta Sans', sans-serif;
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100vh;
            overflow: hidden;
            text-align: center;
        }

        /* Background animée subtile */
        .ambient-glow {
            position: absolute;
            width: 400px;
            height: 400px;
            background: radial-gradient(circle, rgba(34, 211, 238, 0.15) 0%, transparent 70%);
            z-index: -1;
            filter: blur(60px);
            animation: pulse 8s infinite alternate;
        }

        @keyframes pulse {
            from { transform: scale(1); opacity: 0.5; }
            to { transform: scale(1.2); opacity: 0.8; }
        }

        .container {
            max-width: 500px;
            padding: 2rem;
            background: var(--card);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 24px;
            backdrop-filter: blur(12px);
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
        }

        .icon-box {
            font-size: 3rem;
            color: var(--accent);
            margin-bottom: 1.5rem;
            animation: float 3s ease-in-out infinite;
        }

        @keyframes float {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-10px); }
        }

        h1 {
            font-size: 1.8rem;
            font-weight: 800;
            margin-bottom: 1rem;
            letter-spacing: -0.5px;
        }

        p {
            color: var(--text-muted);
            font-size: 1rem;
            line-height: 1.6;
            margin-bottom: 2rem;
        }

        .btn {
            display: inline-flex;
            align-items: center;
            gap: 10px;
            background-color: var(--text-main);
            color: var(--bg);
            text-decoration: none;
            padding: 0.8rem 1.8rem;
            border-radius: 12px;
            font-weight: 600;
            font-size: 0.9rem;
            transition: all 0.3s ease;
        }

        .btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 10px 20px rgba(34, 211, 238, 0.2);
            background-color: var(--accent);
        }

        .footer-note {
            margin-top: 2rem;
            font-size: 0.75rem;
            color: var(--text-muted);
            opacity: 0.6;
        }
    </style>
</head>
<body>
    <div class="ambient-glow"></div>

    <div class="container">
        <div class="icon-box">
            <i class="fas fa-screwdriver-wrench"></i>
        </div>
        <h1>Maintenance en cours</h1>
        <p>
            Cette section est actuellement en cours de construction pour vous offrir une expérience optimale. 
            Nous revenons très bientôt !
        </p>
        
        <a href="https://nicolasbn040520039.wixsite.com/portfolio-nblin" class="btn">
            Consulter le dossier technique <i class="fas fa-arrow-right"></i>
        </a>

        <div class="footer-note">
            © 2026 Nicolas Blin | Expert SI & Cloud
        </div>
    </div>
</body>
</html>
