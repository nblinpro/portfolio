<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>En déploiement | Nicolas Blin</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #020617;
            --accent: #22d3ee;
            --accent-glow: rgba(34, 211, 238, 0.3);
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --card-bg: rgba(15, 23, 42, 0.6);
        }

        * { box-sizing: border-box; }

        body {
            margin: 0;
            padding: 0;
            background-color: var(--bg);
            color: var(--text-main);
            font-family: 'Plus Jakarta Sans', sans-serif;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            overflow: hidden;
            position: relative;
        }

        /* --- BACKGROUND ANIMATION --- */
        body::before {
            content: "";
            position: absolute;
            width: 200%;
            height: 200%;
            background-image: 
                linear-gradient(rgba(34, 211, 238, 0.05) 1px, transparent 1px),
                linear-gradient(90deg, rgba(34, 211, 238, 0.05) 1px, transparent 1px);
            background-size: 50px 50px;
            transform: perspective(500px) rotateX(60deg) translateY(-10%);
            animation: grid-move 20s linear infinite;
            z-index: -1;
        }

        @keyframes grid-move {
            from { background-position: 0 0; }
            to { background-position: 0 100%; }
        }

        /* --- CONTAINER --- */
        .container {
            max-width: 550px;
            width: 90%;
            padding: 3.5rem 2.5rem;
            background: var(--card-bg);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 32px;
            backdrop-filter: blur(20px);
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
            text-align: center;
            animation: fadeIn 0.8s ease-out;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* --- PROGRESS BAR --- */
        .status-badge {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            background: rgba(34, 211, 238, 0.1);
            color: var(--accent);
            padding: 6px 16px;
            border-radius: 100px;
            font-size: 0.8rem;
            font-weight: 600;
            margin-bottom: 2rem;
            border: 1px solid var(--accent-glow);
        }

        .pulse {
            width: 8px;
            height: 8px;
            background: var(--accent);
            border-radius: 50%;
            box-shadow: 0 0 0 0 var(--accent-glow);
            animation: pulse-animation 2s infinite;
        }

        @keyframes pulse-animation {
            0% { box-shadow: 0 0 0 0 var(--accent-glow); }
            70% { box-shadow: 0 0 0 10px rgba(34, 211, 238, 0); }
            100% { box-shadow: 0 0 0 0 rgba(34, 211, 238, 0); }
        }

        h1 {
            font-size: 2.5rem;
            font-weight: 800;
            margin-bottom: 1rem;
            letter-spacing: -0.02em;
            background: linear-gradient(to right, #fff, var(--accent));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        p {
            color: var(--text-muted);
            margin-bottom: 2.5rem;
            line-height: 1.6;
            font-size: 1.1rem;
        }

        /* --- BUTTONS --- */
        .actions {
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .btn-primary {
            background: var(--accent);
            color: var(--bg);
            text-decoration: none;
            padding: 1rem 2rem;
            border-radius: 16px;
            font-weight: 700;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            box-shadow: 0 10px 15px -3px var(--accent-glow);
        }

        .btn-primary:hover {
            transform: translateY(-3px);
            box-shadow: 0 20px 25px -5px var(--accent-glow);
            filter: brightness(1.1);
        }

        .btn-back {
            color: var(--text-muted);
            text-decoration: none;
            font-size: 0.95rem;
            font-weight: 500;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            transition: 0.3s;
            margin-top: 1rem;
        }

        .btn-back:hover {
            color: var(--accent);
            transform: translateX(-5px);
        }

        .footer-note {
            margin-top: 3.5rem;
            font-size: 0.8rem;
            color: var(--text-muted);
            opacity: 0.6;
            border-top: 1px solid rgba(255, 255, 255, 0.05);
            padding-top: 1.5rem;
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="status-badge">
            <span class="pulse"></span>
            CI/CD EN COURS
        </div>
        
        <h1>Projet en déploiement</h1>
        <p>Je peaufine les derniers détails techniques et la documentation système pour vous offrir une vue complète de l'architecture.</p>
        
        <div class="actions">
            <a href="https://nicolasbn040520039.wixsite.com/portfolio-nblin" class="btn-primary" target="_blank">
                <i class="fa-brands fa-github"></i> Explorer les sources
            </a>

            <a href="https://nblinpro.github.io/portfolio/pages/projets.html" class="btn-back">
                <i class="fa-solid fa-arrow-left"></i> Retour au catalogue projets
            </a>
        </div>

        <div class="footer-note">
            © 2026 Nicolas Blin — Architecte & Expert SI
        </div>
    </div>

</body>
</html>
